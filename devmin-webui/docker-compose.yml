name: devmin

services:
  webui:
    image: ${IMAGE_TAG:-pc-armin/devmin-webui:latest}
    container_name: devmin-webui
    environment:
      API_HOST: ${API_HOST:-devmin-api}
      API_PORT: ${API_PORT:-8195}
    expose:
      - "${INTERNAL_PORT:-80}"
    ports:
      - target: ${INTERNAL_PORT:-80}
        published: ${PUBLISH_PORT-5195}
        protocol: tcp
    networks:
      - app_net
    restart: "no"

networks:
  app_net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true