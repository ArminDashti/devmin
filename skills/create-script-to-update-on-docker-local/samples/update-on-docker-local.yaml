# Local update/redeploy settings — copy to devmin/scripts/docker/<repo_name>/ and adapt.
# Scripts read this file only (no CLI -- flags).
# Non-empty override fields replace values from compose_file / dockerfile.

stack_name: myapp
image_tag: myapp:latest
compose_file: ../../../docker-compose.yml
dockerfile: ../../../dockerfile
docker_network: myapp-net
internal_port: ""
publish_port: ""
delete_volume: "no"  # update: keep volumes
delete_image: "yes"
