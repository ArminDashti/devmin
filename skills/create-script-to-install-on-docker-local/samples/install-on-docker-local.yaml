# Local first-time install — devmin/scripts/docker/<repo_name>/install-on-docker-local.yaml
# compose_file and dockerfile are relative to target_repo (not the script folder).

target_repo: C:/Users/armin/GitHub/myapp
stack_name: myapp
image_tag: myapp:latest
compose_file: docker-compose.yml
dockerfile: dockerfile
docker_network: myapp-net
internal_port: ""
publish_port: ""
delete_volume: "yes"
delete_image: "yes"
