api_internal_port: "8195"
webui_image_tag: pc-armin/devmin-webui:latest
webui_compose_file: ../../devmin-webui/docker-compose.yml
webui_dockerfile: ../../devmin-webui/Dockerfile
webui_internal_port: "80"
