stack_name: devmin
server: irancell-t3
ssh: ssh t3
volume_dir: /cloud-admin/docker-volumes/devmin
domain: devmin.xaigrok.ir
docker_network: t3-net
publish_port: ""
delete_volume: "no"
delete_image: "no"
build_image_on: local
